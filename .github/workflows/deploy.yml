name: CI/CD Level 3 Pipeline (GHCR Registry)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: read
  packages: write

jobs:
  # 🧪 CI: Run syntax and validation checks
  test:
    name: Run Syntax & Lint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  # 🚀 CD: Build image in GitHub Cloud, push to GHCR, then pull & restart on Server
  build-and-deploy:
    name: Build Image & Deploy to Server
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/roshan-kawale/learn-server-deployment-web:latest

      - name: Deploy via SSH over Cloudflare Tunnel
        run: |
          # 1. Install cloudflared
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          
          # 2. Setup SSH Key and Config
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          cat <<EOF > ~/.ssh/config
          Host ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

          # 3. Pull pre-built image from GHCR & restart stack (Zero compilation load on server)
          echo "🚀 Pulling latest image from GHCR and restarting stack..."
          ssh ${{ secrets.SERVER_HOST }} "cd C:\work\learn-server-deployment || cd C:\Users\rosha\learn-server-deployment & docker compose pull & docker compose up -d"
          echo "✅ Level 3 Production Deployment Complete!"
