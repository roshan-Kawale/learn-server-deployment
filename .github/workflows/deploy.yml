name: CI/CD Level 2 Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  # 🧪 CI: Run syntax and validation checks
  test:
    name: Run Syntax & Lint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  # 🚀 CD: SSH into server & rebuild Docker Compose stack via Cloudflare Tunnel
  deploy:
    name: Deploy to Production Server
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH over Cloudflare Tunnel
        run: |
          # 1. Install cloudflared
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          
          # 2. Setup SSH Key and Config
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          cat <<EOF > ~/.ssh/config
          Host ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

          # 3. Execute SSH deployment
          echo "🚀 Starting automated deployment..."
          ssh ${{ secrets.SERVER_HOST }} "cd C:\work\learn-server-deployment || cd C:\Users\rosha\learn-server-deployment & git pull origin main & docker compose up -d --build"
          echo "✅ Deployment complete!"
